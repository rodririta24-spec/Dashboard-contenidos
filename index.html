<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard · Contenidos</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0f172a;
      --surface:    #1e293b;
      --surface2:   #263548;
      --border:     #334155;
      --text:       #e2e8f0;
      --muted:      #94a3b8;
      --green:      #10b981;
      --green-bg:   rgba(16,185,129,.15);
      --yellow:     #f59e0b;
      --yellow-bg:  rgba(245,158,11,.15);
      --blue:       #3b82f6;
      --blue-bg:    rgba(59,130,246,.15);
      --red:        #ef4444;
      --red-bg:     rgba(239,68,68,.15);
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ──────────────────────────────────────── */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.9rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-left { display: flex; align-items: center; gap: 1rem; }
    .header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .header h1 span { color: var(--blue); }
    .header-meta { font-size: 0.75rem; color: var(--muted); }
    .btn-refresh {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 0.4rem 0.9rem;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: border-color .15s;
    }
    .btn-refresh:hover { border-color: var(--blue); }
    .btn-refresh.spinning svg { animation: spin .7s linear infinite; }

    /* ── Layout ──────────────────────────────────────── */
    .main {
      max-width: 1440px;
      margin: 0 auto;
      padding: 1.5rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* ── KPI Cards ───────────────────────────────────── */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1rem;
    }
    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.1rem 1.25rem;
      border-left-width: 3px;
    }
    .kpi-card .lbl {
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: .45rem;
    }
    .kpi-card .val {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1;
    }
    .kpi-card .sub {
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: .3rem;
    }
    .kpi-card.neutral { border-left-color: var(--border); }
    .kpi-card.green   { border-left-color: var(--green);  } .kpi-card.green  .val { color: var(--green);  }
    .kpi-card.yellow  { border-left-color: var(--yellow); } .kpi-card.yellow .val { color: var(--yellow); }
    .kpi-card.blue    { border-left-color: var(--blue);   } .kpi-card.blue   .val { color: var(--blue);   }

    /* ── Two-col row ─────────────────────────────────── */
    .row2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    /* ── Card shell ──────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      overflow: hidden;
    }
    .card-title {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: .9rem;
      display: flex;
      align-items: center;
      gap: .5rem;
    }
    .card-title .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── Badges ──────────────────────────────────────── */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: .2rem .6rem;
      border-radius: 999px;
      font-size: .72rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .badge.entregado { background: var(--green-bg);  color: var(--green);  }
    .badge.guionado  { background: var(--yellow-bg); color: var(--yellow); }
    .badge.edicion   { background: var(--blue-bg);   color: var(--blue);   }
    .badge.default   { background: var(--surface2);  color: var(--muted);  }

    /* ── Date spans ──────────────────────────────────── */
    .dt { font-size: .8rem; color: var(--muted); white-space: nowrap; }
    .dt.overdue { color: var(--red); font-weight: 600; }
    .dt.today   { color: var(--yellow); font-weight: 600; }
    .dt.soon    { color: #fb923c; }

    /* ── Tables ──────────────────────────────────────── */
    .tbl {
      width: 100%;
      border-collapse: collapse;
      font-size: .85rem;
    }
    .tbl th {
      text-align: left;
      padding: .5rem .75rem;
      color: var(--muted);
      font-weight: 500;
      font-size: .7rem;
      text-transform: uppercase;
      letter-spacing: .04em;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    .tbl td {
      padding: .7rem .75rem;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    .tbl tr:last-child td { border-bottom: none; }
    .tbl tbody tr:hover td { background: var(--surface2); }
    .titulo-cell { font-weight: 500; max-width: 260px; }
    .empty-row td {
      text-align: center;
      color: var(--muted);
      padding: 2rem;
      font-size: .85rem;
    }

    /* ── Charts ──────────────────────────────────────── */
    .chart-wrap { position: relative; height: 230px; }

    /* ── Filters ─────────────────────────────────────── */
    .filters {
      display: flex;
      gap: .65rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    .filter-sel, .search-inp {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: .45rem .75rem;
      font-size: .82rem;
      outline: none;
      cursor: pointer;
    }
    .filter-sel:focus, .search-inp:focus { border-color: var(--blue); }
    .search-inp { flex: 1; min-width: 200px; }
    .search-inp::placeholder { color: var(--muted); }

    /* ── Pagination ──────────────────────────────────── */
    .pagination {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: .4rem;
      margin-top: .9rem;
      font-size: .78rem;
      color: var(--muted);
      flex-wrap: wrap;
    }
    .pg-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: .28rem .65rem;
      cursor: pointer;
      font-size: .78rem;
      line-height: 1.4;
    }
    .pg-btn:hover { border-color: var(--blue); }
    .pg-btn.active { background: var(--blue); border-color: var(--blue); color: #fff; }
    .pg-btn:disabled { opacity: .35; cursor: default; pointer-events: none; }

    /* ── Loading ─────────────────────────────────────── */
    .loading {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--muted);
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Responsive ──────────────────────────────────── */
    @media (max-width: 900px) {
      .row2 { grid-template-columns: 1fr; }
      .main { padding: 1rem; }
      .header { padding: .8rem 1rem; }
    }
    @media (max-width: 640px) {
      .tbl th:nth-child(n+5),
      .tbl td:nth-child(n+5) { display: none; }
    }
  </style>
</head>
<body>

<!-- ── Header ───────────────────────────────────────────── -->
<header class="header">
  <div class="header-left">
    <h1>Dashboard · <span>Contenidos</span></h1>
    <span class="header-meta" id="last-update">Cargando...</span>
  </div>
  <button class="btn-refresh" id="btn-refresh" onclick="loadData()">
    <svg id="refresh-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>
    </svg>
    Actualizar
  </button>
</header>

<!-- ── Main ─────────────────────────────────────────────── -->
<main class="main" id="main">
  <div class="loading">
    <div class="spinner"></div>
    Cargando datos desde Google Sheets...
  </div>
</main>

<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTnydry1o935VKl9WTgIcI_yDevOmb_RohtZ1PIBjYHF6ycfGX646zIbI2mSkQ5T4pUkzUofbuFGiLF/pub?output=csv';

// ── Utilidades ───────────────────────────────────────────────

function parseDate(str) {
  if (!str || !str.trim()) return null;
  const p = str.trim().split('/');
  if (p.length !== 3) return null;
  const [d, m, y] = p.map(Number);
  if (!d || !m || !y) return null;
  return new Date(y, m - 1, d);
}

function fmtDate(str) {
  const d = parseDate(str);
  if (!d) return '—';
  return d.toLocaleDateString('es-AR', { day: 'numeric', month: 'short' });
}

function getWeek() {
  const now = new Date(); now.setHours(0,0,0,0);
  const day = now.getDay();
  const mon = new Date(now);
  mon.setDate(now.getDate() - (day === 0 ? 6 : day - 1));
  const sun = new Date(mon);
  sun.setDate(mon.getDate() + 6); sun.setHours(23,59,59,999);
  return { mon, sun };
}

function inWeek(row, wk) {
  const i = parseDate(row['Fecha de inicio']);
  const l = parseDate(row['Fecha Limite']);
  return (i && i >= wk.mon && i <= wk.sun) || (l && l >= wk.mon && l <= wk.sun);
}

function dtClass(str) {
  const d = parseDate(str);
  if (!d) return '';
  const today = new Date(); today.setHours(0,0,0,0);
  if (d < today) return 'overdue';
  const diff = (d - today) / 864e5;
  if (diff <= 1) return 'today';
  if (diff <= 3) return 'soon';
  return '';
}

function badgeClass(estado) {
  if (!estado) return 'default';
  const e = estado.toLowerCase();
  if (e.includes('entregado')) return 'entregado';
  if (e.includes('guionado'))  return 'guionado';
  if (e.includes('edici'))     return 'edicion';
  return 'default';
}

function cleanRow(row) {
  const out = {};
  for (const k of Object.keys(row)) out[k.trim()] = (row[k] || '').trim();
  return out;
}

// ── Estado global ────────────────────────────────────────────

let allData      = [];
let filteredData = [];
let currentPage  = 1;
const PAGE_SIZE  = 20;
let chartEstado  = null;
let chartCliente = null;

// ── Render principal ─────────────────────────────────────────

function render(data) {
  allData = data.map(cleanRow).filter(r => r['Titulo']);
  filteredData = [...allData];

  document.getElementById('main').innerHTML = `

    <!-- KPIs -->
    <div class="kpi-grid" id="kpi-grid"></div>

    <!-- Esta semana + Pendientes -->
    <div class="row2">
      <div class="card" id="card-semana"></div>
      <div class="card" id="card-pendientes"></div>
    </div>

    <!-- Charts -->
    <div class="row2">
      <div class="card">
        <div class="card-title"><div class="dot" style="background:var(--blue)"></div>Estado de proyectos</div>
        <div class="chart-wrap"><canvas id="chart-estado"></canvas></div>
      </div>
      <div class="card">
        <div class="card-title"><div class="dot" style="background:var(--green)"></div>Proyectos por cliente</div>
        <div class="chart-wrap"><canvas id="chart-cliente"></canvas></div>
      </div>
    </div>

    <!-- Tabla completa -->
    <div class="card">
      <div class="card-title"><div class="dot" style="background:var(--muted)"></div>Todos los proyectos</div>
      <div class="filters">
        <select class="filter-sel" id="f-estado"  onchange="applyFilters()">
          <option value="">Todos los estados</option>
          ${uniqueSorted(allData,'Estado').map(v=>`<option>${v}</option>`).join('')}
        </select>
        <select class="filter-sel" id="f-cliente" onchange="applyFilters()">
          <option value="">Todos los clientes</option>
          ${uniqueSorted(allData,'Cliente').map(v=>`<option>${v}</option>`).join('')}
        </select>
        <select class="filter-sel" id="f-host"    onchange="applyFilters()">
          <option value="">Todos los hosts</option>
          ${uniqueSorted(allData,'Host').map(v=>`<option>${v}</option>`).join('')}
        </select>
        <input class="search-inp" id="search" type="text" placeholder="Buscar proyecto..." oninput="applyFilters()" />
      </div>
      <div id="tbl-wrap"></div>
      <div class="pagination" id="pagination"></div>
    </div>
  `;

  renderKPIs();
  renderSemana();
  renderPendientes();
  renderCharts();
  renderTable();
}

// ── KPIs ─────────────────────────────────────────────────────

function renderKPIs() {
  const total      = allData.length;
  const entregados = allData.filter(r => r['Estado'].toLowerCase().includes('entregado')).length;
  const guionados  = allData.filter(r => r['Estado'].toLowerCase().includes('guionado')).length;
  const edicion    = allData.filter(r => r['Estado'].toLowerCase().includes('edici')).length;
  const wk = getWeek();
  const semana = allData.filter(r => inWeek(r, wk)).length;

  document.getElementById('kpi-grid').innerHTML = `
    <div class="kpi-card neutral">
      <div class="lbl">Total proyectos</div>
      <div class="val">${total}</div>
    </div>
    <div class="kpi-card green">
      <div class="lbl">Entregados</div>
      <div class="val">${entregados}</div>
      <div class="sub">${Math.round(entregados/total*100)}% del total</div>
    </div>
    <div class="kpi-card yellow">
      <div class="lbl">Guionados</div>
      <div class="val">${guionados}</div>
      <div class="sub">Pendientes de filmar/editar</div>
    </div>
    <div class="kpi-card blue">
      <div class="lbl">En edición</div>
      <div class="val">${edicion}</div>
    </div>
    <div class="kpi-card" style="border-left-color:#a78bfa">
      <div class="lbl">Esta semana</div>
      <div class="val" style="color:#a78bfa">${semana}</div>
      <div class="sub">Con fechas en la semana actual</div>
    </div>
  `;
}

// ── Esta semana ──────────────────────────────────────────────

function renderSemana() {
  const wk = getWeek();
  const proyectos = allData.filter(r => inWeek(r, wk));
  const card = document.getElementById('card-semana');

  const weekLabel = `${wk.mon.toLocaleDateString('es-AR',{day:'numeric',month:'short'})} – ${wk.sun.toLocaleDateString('es-AR',{day:'numeric',month:'short',year:'numeric'})}`;

  card.innerHTML = `
    <div class="card-title">
      <div class="dot" style="background:#a78bfa"></div>
      Esta semana
      <span style="margin-left:auto;font-weight:400;font-size:.7rem">${weekLabel}</span>
    </div>
    ${proyectos.length === 0
      ? `<p style="color:var(--muted);font-size:.85rem;padding:.5rem 0">Sin proyectos con fechas en esta semana.</p>`
      : `<table class="tbl">
          <thead><tr>
            <th>Proyecto</th><th>Inicio</th><th>Límite</th><th>Estado</th>
          </tr></thead>
          <tbody>
            ${proyectos.map(r=>`
              <tr>
                <td class="titulo-cell">${r['Titulo']}</td>
                <td><span class="dt">${fmtDate(r['Fecha de inicio'])}</span></td>
                <td><span class="dt ${dtClass(r['Fecha Limite'])}">${fmtDate(r['Fecha Limite'])}</span></td>
                <td><span class="badge ${badgeClass(r['Estado'])}">${r['Estado']||'—'}</span></td>
              </tr>`).join('')}
          </tbody>
        </table>`
    }
  `;
}

// ── Pendientes ───────────────────────────────────────────────

function renderPendientes() {
  const pendientes = allData
    .filter(r => !r['Estado'].toLowerCase().includes('entregado'))
    .sort((a,b) => {
      const da = parseDate(a['Fecha de inicio']) || new Date(9999,0,1);
      const db = parseDate(b['Fecha de inicio']) || new Date(9999,0,1);
      return da - db;
    });

  const card = document.getElementById('card-pendientes');
  card.innerHTML = `
    <div class="card-title">
      <div class="dot" style="background:var(--yellow)"></div>
      Pendientes
      <span style="margin-left:auto;font-weight:400;font-size:.7rem">${pendientes.length} proyecto${pendientes.length!==1?'s':''}</span>
    </div>
    ${pendientes.length === 0
      ? `<p style="color:var(--muted);font-size:.85rem;padding:.5rem 0">Todo entregado.</p>`
      : `<table class="tbl">
          <thead><tr>
            <th>Proyecto</th><th>Cliente</th><th>Inicio</th><th>Estado</th>
          </tr></thead>
          <tbody>
            ${pendientes.map(r=>`
              <tr>
                <td class="titulo-cell">${r['Titulo']}</td>
                <td style="color:var(--muted);font-size:.8rem">${r['Cliente']}</td>
                <td><span class="dt ${dtClass(r['Fecha de inicio'])}">${fmtDate(r['Fecha de inicio'])}</span></td>
                <td><span class="badge ${badgeClass(r['Estado'])}">${r['Estado']||'—'}</span></td>
              </tr>`).join('')}
          </tbody>
        </table>`
    }
  `;
}

// ── Gráficos ─────────────────────────────────────────────────

function renderCharts() {
  // Estado
  const estadoCounts = {};
  allData.forEach(r => {
    const e = r['Estado'] || 'Sin estado';
    estadoCounts[e] = (estadoCounts[e] || 0) + 1;
  });
  const estadoColors = Object.keys(estadoCounts).map(k => {
    const kl = k.toLowerCase();
    if (kl.includes('entregado')) return '#10b981';
    if (kl.includes('guionado'))  return '#f59e0b';
    if (kl.includes('edici'))     return '#3b82f6';
    return '#6b7280';
  });

  if (chartEstado) chartEstado.destroy();
  chartEstado = new Chart(document.getElementById('chart-estado'), {
    type: 'doughnut',
    data: {
      labels: Object.keys(estadoCounts),
      datasets: [{ data: Object.values(estadoCounts), backgroundColor: estadoColors, borderWidth: 2, borderColor: '#1e293b' }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: 'bottom', labels: { color: '#94a3b8', padding: 14, font: { size: 12 } } }
      }
    }
  });

  // Cliente
  const clienteCounts = {};
  allData.forEach(r => {
    const c = r['Cliente'] || 'Otro';
    clienteCounts[c] = (clienteCounts[c] || 0) + 1;
  });
  const clienteColors = ['#3b82f6','#10b981','#f59e0b','#8b5cf6','#ef4444'];

  if (chartCliente) chartCliente.destroy();
  chartCliente = new Chart(document.getElementById('chart-cliente'), {
    type: 'bar',
    data: {
      labels: Object.keys(clienteCounts),
      datasets: [{
        label: 'Proyectos',
        data: Object.values(clienteCounts),
        backgroundColor: Object.keys(clienteCounts).map((_,i) => clienteColors[i % clienteColors.length]),
        borderRadius: 6, borderWidth: 0,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
        y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8', stepSize: 1 }, beginAtZero: true }
      }
    }
  });
}

// ── Tabla completa ───────────────────────────────────────────

function applyFilters() {
  const estado  = document.getElementById('f-estado')?.value  || '';
  const cliente = document.getElementById('f-cliente')?.value || '';
  const host    = document.getElementById('f-host')?.value    || '';
  const search  = (document.getElementById('search')?.value   || '').toLowerCase();

  filteredData = allData.filter(r => {
    if (estado  && r['Estado']  !== estado)  return false;
    if (cliente && r['Cliente'] !== cliente) return false;
    if (host    && r['Host']    !== host)    return false;
    if (search  && !r['Titulo'].toLowerCase().includes(search)) return false;
    return true;
  });
  currentPage = 1;
  renderTable();
}

function renderTable() {
  const start     = (currentPage - 1) * PAGE_SIZE;
  const pageData  = filteredData.slice(start, start + PAGE_SIZE);
  const totalPg   = Math.ceil(filteredData.length / PAGE_SIZE);

  document.getElementById('tbl-wrap').innerHTML = `
    <table class="tbl">
      <thead><tr>
        <th>#</th><th>Proyecto</th><th>Cliente</th><th>División</th>
        <th>Host</th><th>Inicio</th><th>Límite</th><th>Estado</th>
      </tr></thead>
      <tbody>
        ${pageData.length === 0
          ? `<tr class="empty-row"><td colspan="8">Sin resultados para los filtros aplicados.</td></tr>`
          : pageData.map((r, i) => `
              <tr>
                <td style="color:var(--muted);font-size:.75rem">${start + i + 1}</td>
                <td class="titulo-cell">${r['Titulo']}</td>
                <td style="color:var(--muted)">${r['Cliente'] || '—'}</td>
                <td style="color:var(--muted);font-size:.8rem">${r['División'] || r['División'] || '—'}</td>
                <td>${r['Host'] || '—'}</td>
                <td><span class="dt">${fmtDate(r['Fecha de inicio'])}</span></td>
                <td><span class="dt ${dtClass(r['Fecha Limite'])}">${fmtDate(r['Fecha Limite'])}</span></td>
                <td><span class="badge ${badgeClass(r['Estado'])}">${r['Estado'] || '—'}</span></td>
              </tr>`).join('')
        }
      </tbody>
    </table>
  `;

  const pg = document.getElementById('pagination');
  if (totalPg <= 1) { pg.innerHTML = `<span>${filteredData.length} proyectos</span>`; return; }

  let btns = '';
  for (let i = 1; i <= totalPg; i++) {
    btns += `<button class="pg-btn${i===currentPage?' active':''}" onclick="goPage(${i})">${i}</button>`;
  }
  pg.innerHTML = `
    <span>${filteredData.length} proyectos · Página ${currentPage} de ${totalPg}</span>
    <button class="pg-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>
    ${btns}
    <button class="pg-btn" onclick="goPage(${currentPage+1})" ${currentPage===totalPg?'disabled':''}>›</button>
  `;
}

function goPage(n) {
  const totalPg = Math.ceil(filteredData.length / PAGE_SIZE);
  if (n < 1 || n > totalPg) return;
  currentPage = n;
  renderTable();
  document.getElementById('tbl-wrap').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ── Helpers ──────────────────────────────────────────────────

function uniqueSorted(data, key) {
  return [...new Set(data.map(r => r[key]).filter(Boolean))].sort();
}

// ── Carga de datos ───────────────────────────────────────────

async function loadData() {
  const btn  = document.getElementById('btn-refresh');
  const icon = document.getElementById('refresh-icon');
  if (btn)  btn.disabled = true;
  if (icon) icon.parentElement.classList.add('spinning');

  try {
    const res  = await fetch(CSV_URL + '&cb=' + Date.now());
    const text = await res.text();

    Papa.parse(text, {
      header: true,
      skipEmptyLines: true,
      complete(results) {
        render(results.data);
        document.getElementById('last-update').textContent =
          'Actualizado ' + new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
      },
      error(err) {
        showError('Error al parsear CSV: ' + err.message);
      }
    });
  } catch (err) {
    showError('No se pudo conectar con Google Sheets: ' + err.message);
  } finally {
    if (btn)  btn.disabled = false;
    if (icon) icon.parentElement.classList.remove('spinning');
  }
}

function showError(msg) {
  document.getElementById('main').innerHTML =
    `<div class="loading" style="color:var(--red)">${msg}<br><br>
     <button class="btn-refresh" onclick="loadData()" style="margin:0 auto">Reintentar</button></div>`;
}

// ── Inicio ───────────────────────────────────────────────────
loadData();
</script>
